name: Repository quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Fabric item folders exist
        run: python src/quality_checks.py
      - name: Generate synthetic Bronze data (asserts expected row counts)
        run: python src/generate_bronze_data.py --out "$RUNNER_TEMP/bronze"
